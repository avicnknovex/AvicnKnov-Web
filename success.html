<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Account Verified — AvicnKnov Exchange</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0a0a0a;--surface:#111111;--surface2:#1a1a1a;
  --border:#222;--border2:#333;--white:#ffffff;--gray:#888;--gray2:#555;
  --green:#00e676;--green2:rgba(0,230,118,0.12);--green3:rgba(0,230,118,0.06);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif;overflow:hidden;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:#0a0a0a;}
::-webkit-scrollbar-thumb{background:#333;border-radius:2px;}

body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:9999;opacity:0.4;
}

/* GLOW BG */
.glow-bg{
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 700px 500px at 50% 40%, rgba(0,230,118,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 400px 300px at 20% 80%, rgba(0,230,118,0.03) 0%, transparent 70%);
  pointer-events:none;
}

/* GRID LINES */
.grid-bg{
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size:60px 60px;
  pointer-events:none;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 50%, black, transparent);
}

/* CONTAINER */
.page{
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:40px 20px;
}

/* LOGO */
.logo-wrap{
  display:flex;align-items:center;gap:10px;margin-bottom:56px;
  opacity:0;animation:fadeUp .6s ease both;
}
.logo-icon-wrap{
  width:38px;height:38px;border-radius:10px;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);
  backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 16px rgba(255,255,255,0.06),inset 0 1px 0 rgba(255,255,255,0.1);
  overflow:hidden;
}
.logo-icon{width:26px;height:26px;object-fit:contain;filter:brightness(0) invert(1);}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;}

/* SUCCESS ICON */
.check-ring{
  position:relative;width:100px;height:100px;margin-bottom:36px;
  opacity:0;animation:fadeUp .6s .1s ease both;
}
.check-ring svg{width:100%;height:100%;}
.check-circle{
  fill:none;stroke:var(--green);stroke-width:2;
  stroke-dasharray:283;stroke-dashoffset:283;
  animation:drawCircle .8s .4s cubic-bezier(.4,0,.2,1) forwards;
}
.check-mark{
  fill:none;stroke:var(--green);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:60;stroke-dashoffset:60;
  animation:drawCheck .5s 1.1s cubic-bezier(.4,0,.2,1) forwards;
}
@keyframes drawCircle{to{stroke-dashoffset:0;}}
@keyframes drawCheck{to{stroke-dashoffset:0;}}

/* GLOW PULSE BEHIND ICON */
.check-glow{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,230,118,0.15),transparent 70%);
  animation:glowPulse 2s 1.2s ease infinite;
}
@keyframes glowPulse{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1);}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15);}}

/* TEXT */
.success-label{
  font-family:'Space Mono',monospace;font-size:11px;letter-spacing:3px;
  text-transform:uppercase;color:var(--green);margin-bottom:14px;
  opacity:0;animation:fadeUp .6s .8s ease both;
}
.success-title{
  font-family:'Bebas Neue',sans-serif;font-size:clamp(36px,6vw,64px);
  letter-spacing:4px;line-height:1;text-align:center;margin-bottom:16px;
  opacity:0;animation:fadeUp .6s .9s ease both;
}
.success-sub{
  font-size:15px;color:var(--gray);line-height:1.7;text-align:center;
  max-width:440px;margin-bottom:48px;
  opacity:0;animation:fadeUp .6s 1s ease both;
}

/* TIMER BAR */
.timer-wrap{
  width:min(380px,90vw);
  opacity:0;animation:fadeUp .6s 1.1s ease both;
}
.timer-label{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:8px;font-size:12px;color:var(--gray2);font-family:'Space Mono',monospace;
}
.timer-countdown{color:var(--green);font-weight:700;}
.timer-bar-bg{
  height:3px;background:var(--border2);border-radius:100px;overflow:hidden;
}
.timer-bar-fill{
  height:100%;background:var(--green);border-radius:100px;
  width:100%;transform-origin:left;
  animation:drainBar 5s 1.4s linear forwards;
}
@keyframes drainBar{from{width:100%;}to{width:0%;}}

/* REDIRECT NOTE */
.redirect-note{
  margin-top:20px;font-size:12px;color:var(--gray2);text-align:center;
  opacity:0;animation:fadeUp .6s 1.2s ease both;
}
.redirect-note a{color:var(--white);text-decoration:none;font-weight:600;}
.redirect-note a:hover{text-decoration:underline;}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div class="glow-bg"></div>
<div class="grid-bg"></div>

<div class="page">
  <div class="logo-wrap">
    <div class="logo-icon-wrap">
      <img class="logo-icon" src="1000006970.png" onerror="this.style.display='none'" alt="AvicnKnov"/>
    </div>
    <span style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;">AvicnKnov</span>
  </div>

  <div class="check-ring">
    <div class="check-glow"></div>
    <svg viewBox="0 0 100 100">
      <circle class="check-circle" cx="50" cy="50" r="45"/>
      <polyline class="check-mark" points="28,52 43,67 72,36"/>
    </svg>
  </div>

  <div class="success-label">Verification Complete</div>
  <h1 class="success-title">Account Verified</h1>
  <p class="success-sub">Your AvicnKnov account has been successfully verified and activated. You now have full access to the world's most advanced crypto trading ecosystem.</p>

  <div class="timer-wrap">
    <div class="timer-label">
      <span>Redirecting to login</span>
      <span class="timer-countdown" id="countdownDisplay">5s</span>
    </div>
    <div class="timer-bar-bg">
      <div class="timer-bar-fill"></div>
    </div>
  </div>

  <div class="redirect-note">
    Not redirecting? <a href="index.html">Click here to login</a>
  </div>
</div>

<script>
// Mark account as verified in DB
(async()=>{
  try{
    const { createClient } = supabase;
    const authSupabase = createClient(
      'https://kjxnbofpwfvheuzmeynd.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqeG5ib2Zwd2Z2aGV1em1leW5kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxODUxMTEsImV4cCI6MjA5Mjc2MTExMX0.OBVQFJCWUJh5gTx0Nk8E7EMZEprRNq1L-jCTRFJRbOo'
    );
    // Get the current session user's email from Supabase auth
    const { data: { user } } = await authSupabase.auth.getUser();
    if(user && user.email){
      // Mark verified in user_verify
      await authSupabase.from('user_verify').update({verified:true}).eq('email',user.email);
      // Also copy from process table if not done yet
      const {data:proc} = await authSupabase.from('user_verify_process').select('*').eq('email',user.email).single();
      if(proc){
        const {data:existing} = await authSupabase.from('user_verify').select('id').eq('email',user.email).single().catch(()=>({data:null}));
        if(!existing){
          await authSupabase.from('user_verify').insert({...proc, verified:true});
        }
      }
    }
  }catch(e){}
})();

// Countdown and redirect
let secs = 5;
const display = document.getElementById('countdownDisplay');
const iv = setInterval(()=>{
  secs--;
  display.textContent = secs+'s';
  if(secs<=0){ clearInterval(iv); window.location.href='index.html'; }
},1000);
</script>
</body>
</html>
